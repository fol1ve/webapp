<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Telegram Parser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=261">
</head>
<body>

<!-- ЭФФЕКТЫ ФОН -->
<div class="effects-bg" id="effects-bg"></div>

<div class="page">
    <div class="app">

        <!-- ПЕРЕКЛЮЧАТЕЛЬ ЭФФЕКТОВ -->
        <button class="effects-toggle active" id="effects-btn" onclick="toggleEffects()" title="Эффекты">
            <span class="effects-icon" id="effects-icon">✨</span>
        </button>

        <!-- ЗАГОЛОВОК С ИКОНКОЙ -->
        <div class="header-row">
            <span class="app-icon">🤖</span>
            <h1>Telegram Parser</h1>
        </div>

        <p class="subtitle">Выбери режим и вставь ссылку</p>

        <!-- ФОРМАТ -->
        <div class="format-section">
            <p class="format-label">📁 Формат выгрузки:</p>
            <div class="format-selector">
                <label class="format-checkbox">
                    <input type="checkbox" id="format-csv" checked onchange="updateFormatSelection()">
                    <span class="checkmark"></span>
                    <span class="format-name">CSV</span>
                </label>
                <label class="format-checkbox">
                    <input type="checkbox" id="format-txt" checked onchange="updateFormatSelection()">
                    <span class="checkmark"></span>
                    <span class="format-name">TXT</span>
                </label>
                <label class="format-checkbox">
                    <input type="checkbox" id="format-json" onchange="updateFormatSelection()">
                    <span class="checkmark"></span>
                    <span class="format-name">JSON</span>
                </label>
            </div>
        </div>

        <div id="error" class="error"></div>

        <input id="link" type="text" placeholder="https://t.me/channel">

        <button class="glow-btn shimmer" onclick="sendLink()">
            🚀 Начать парсинг
        </button>

        <div class="hint" id="hint-text">Ты должен быть администратором канала для парсинга участников</div>
    </div>
</div>

<!-- НИЖНЯЯ ПАНЕЛЬ -->
<div class="bottom-bar">
    <button class="nav-btn active" id="nav-participants" onclick="setMode('participants')">
        <span class="nav-icon">👥</span>
        <span class="nav-text">Участники</span>
    </button>
    <button class="nav-btn" id="nav-commentators" onclick="setMode('commentators')">
        <span class="nav-icon">💬</span>
        <span class="nav-text">Комментаторы</span>
    </button>
    <button class="nav-btn" onclick="showComingSoon()">
        <span class="nav-icon">🔍</span>
        <span class="nav-text">Поиск</span>
    </button>
    <button class="nav-btn" onclick="showComingSoon()">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">Настройки</span>
    </button>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
